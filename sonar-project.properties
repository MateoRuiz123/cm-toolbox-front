sonar.projectKey=cm-toolbox-front
sonar.projectName=cm-toolbox-front
sonar.projectDescription=Portal y hub de herramientas de apoyo y diagnostico
sonar.projectVersion=1.20.0
sonar.host.url=https://api.coordinadora.com/sonar/
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts,test/**/*.test.tsx
sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts,src/app/**,src/features/**,src/shared/ui/**,src/shared/auth/auth-context.tsx,src/shared/auth/auth-gate.tsx,src/shared/auth/auth-context-base.ts,src/shared/auth/keycloak-client.ts,src/shared/auth/use-auth.ts,src/shared/auth/use-dev-auth.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/graphify-out/**,**/.cursor/**,**/nginx/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
