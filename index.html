<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <meta name="description" content="Portal centralizado de herramientas de apoyo, diagnóstico y supervisión para la migración de guías y despachos de Coordinadora Mercantil S.A." />

    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Portal de Aplicaciones | Coordinadora Toolbox" />
    <meta property="og:description" content="Supervisión de despachos, trazabilidad en tiempo real y re-migración de guías en Coordinadora Mercantil." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://toolbox.coordinadora.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portal de Aplicaciones | Coordinadora Toolbox" />
    <meta name="twitter:description" content="Supervisión de despachos, trazabilidad en tiempo real y re-migración de guías en Coordinadora Mercantil." />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Portal de Aplicaciones | Coordinadora Toolbox</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
