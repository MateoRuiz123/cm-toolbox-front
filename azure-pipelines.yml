trigger: none

resources:
  repositories:
    - repository: template-apis-ci
      type: git
      name: DevopsInfrasture/template-apis-ci
      ref: refs/heads/release
    - repository: cmlineaminentos
      type: git
      name: DEVOPS_TEMPLATE/cm-lineaminentos
      ref: refs/heads/main

extends:
  template: master_template.yml@template-apis-ci
  parameters:
    integracionContinua:
      tecnologia: 'node-front'
    entregaContinua:
      servicio: 'cloudrun'
