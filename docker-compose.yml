services:
  toolbox-front:
    build:
      context: .
      args:
        VITE_DIAGNOSTICO_URL: /migracion/diagnostico
    ports:
      - "4173:8080"
    environment:
      PORT: ${PORT:-8080}
      DIAGNOSTICO_API_UPSTREAM: ${DIAGNOSTICO_API_UPSTREAM:-http://host.docker.internal:8080/cm-api-internos}
      LOGS_API_UPSTREAM: ${LOGS_API_UPSTREAM:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
        labels: toolbox-front
